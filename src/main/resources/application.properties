spring.application.name=read-java
spring.profiles.default=local

management.endpoints.web.exposure.include=health,info

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/read_english?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.auth.issuer=read-java
app.auth.access-token-ttl=PT2H
app.auth.refresh-token-ttl=P30D
app.auth.jwt-secret=${JWT_ACCESS_SECRET:}
app.auth.dev-login-enabled=false
app.integration.wechat.fake-enabled=false
app.integration.wechat.app-id=${WECHAT_APP_ID:}
app.integration.wechat.app-secret=${WECHAT_APP_SECRET:}
app.integration.wechat.code2-session-url=${WECHAT_CODE2_SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
app.integration.wechat.timeout=${WECHAT_TIMEOUT:PT5S}

# Content administration is deny-by-default; configure explicit application user IDs.
app.content.admin-user-ids=${CONTENT_ADMIN_USER_IDS:}
app.content.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.content.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.content.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
