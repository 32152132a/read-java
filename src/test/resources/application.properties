spring.datasource.url=jdbc:h2:mem:read-java-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.auth.issuer=read-java
app.auth.access-token-ttl=PT2H
app.auth.refresh-token-ttl=P30D
app.auth.jwt-secret=read-java-test-secret-at-least-32-bytes-long
app.auth.dev-login-enabled=true
app.integration.wechat.fake-enabled=true
